services:
  dwh_pipeline:
    build:
      context: .
      dockerfile: dockerfile.dwh
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides the local Windows path from .env
      DAGSTER_HOME: /pipeline/.dagster_home
    volumes:
      - dagster_home:/pipeline/.dagster_home
    #image: <ert_acr>.azurecr.io/dwh_pipeline:latest

  dashboard:
    build:
      context: .
      dockerfile: dockerfile.dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    #image: <ert_acr>.azurecr.io/dashboard:latest

volumes:
  dagster_home:
services:
  dwh_pipeline:
    build:
      context: .
      dockerfile: dockerfile.dwh
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides the local Windows path from .env
      DAGSTER_HOME: /pipeline/.dagster_home
    volumes:
      - dagster_home:/pipeline/.dagster_home
    image: crflightpuntuality.azurecr.io/dwh_pipeline:v4

  dashboard:
    build:
      context: .
      dockerfile: dockerfile.dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    image: crflightpuntuality.azurecr.io/dashboard:v4

volumes:
  dagster_home: